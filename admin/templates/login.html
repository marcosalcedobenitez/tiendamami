<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Distrivariedades El Progreso</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8d8e4,
                    #ead5c4
                );

            color: #4b2e2e;
        }


        .login {
            width: 100%;
            max-width: 400px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(75, 46, 46, 0.15);

            text-align: center;
        }


        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #d96b8b;

            color: white;

            font-size: 28px;
            font-weight: bold;
        }


        h1 {
            margin: 0 0 8px;

            color: #5a3535;
        }


        .subtitulo {
            margin-bottom: 25px;

            color: #777;
        }


        .campo {
            text-align: left;

            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }


        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }


        input:focus {
            border-color: #d96b8b;
        }


        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #d96b8b;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            background: #c75879;
        }


        .error {
            margin-bottom: 18px;

            padding: 12px;

            border-radius: 10px;

            background: #f8d7da;

            color: #842029;

            font-size: 14px;
        }


        .volver {
            display: inline-block;

            margin-top: 20px;

            color: #7a4d3d;

            text-decoration: none;

            font-size: 14px;
        }


        .volver:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="login">

        <div class="logo">
            DV
        </div>

        <h1>Panel de administración</h1>

        <p class="subtitulo">
            Inicia sesión para administrar la tienda.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            <div class="campo">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingresa tu usuario"
                    required
                >

            </div>


            <div class="campo">

                <label for="contrasena">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Ingresa tu contraseña"
                    required
                >

            </div>


            <button type="submit">
                Iniciar sesión
            </button>

        </form>


        <a
            href="{{ url_for('tienda.inicio') }}"
            class="volver"
        >
            ← Volver a la tienda
        </a>

    </div>

</body>

</html>
